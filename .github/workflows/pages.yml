name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy the build to the repository root
        run: |
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html
          cp dist/style.css style.css
          cp dist/favicon.png favicon.png
          touch .nojekyll

      - name: Commit the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets style.css favicon.png .nojekyll
          if git diff --staged --quiet; then
            echo "Published files are already up to date"
            exit 0
          fi
          git commit -m "Publish the built site [skip ci]"
          git push
